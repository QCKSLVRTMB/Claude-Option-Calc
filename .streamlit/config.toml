[theme]
primaryColor = "#1e88e5"
backgroundColor = "#f5f7fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#1a3b4f"
font = "sans serif"

[client]
showErrorDetails = false
showWarningOnDirectExecution = true

[logger]
level = "info"

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[server]
port = 8501
headless = true
runOnSave = true
maxUploadSize = 50
enableCORS = true
enableXsrfProtection = true

[ui]
hideTopBar = false
hideFooterIcons = false

[deprecation]
showPyarrowDeprecationWarning = false
